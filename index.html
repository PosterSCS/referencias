<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referências - Pôster SCS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .pdf-viewer {
            width: 100%;
            height: 550px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: #1e293b;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #0ea5e9;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
        .btn:hover {
            background-color: #0284c7;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Referências - Pôster SCS</h1>
        <p>Visualize o documento abaixo ou clique para baixar no seu dispositivo.</p>
        
        <!-- Visualizador compatível com celulares usando o visualizador do Google Docs embutido -->
        <iframe src="https://docs.google.com/viewer?url=https://posterscs.github.io/referencias/referencias.pdf&embedded=true" class="pdf-viewer"></iframe>

        <!-- Botão de Download -->
        <div>
            <a href="referencias.pdf" class="btn" download>Baixar PDF</a>
        </div>

        <div class="footer">
            Hospedado via GitHub Pages
        </div>
    </div>

</body>
</html>
